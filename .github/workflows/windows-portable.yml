name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install application and build dependencies
        run: python -m pip install . 'pyinstaller==6.22.3' Pillow

      - name: Run related headless tests
        run: >-
          python -m unittest discover -s tests -p test_agent_import.py -v

      - name: Run ledger and onboarding regression checks
        run: |
          python -m unittest discover -s tests -p test_pipeline.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_usage_tour_input.py -v

      - name: Build and test the portable ZIP
        id: portable
        run: |
          python scripts/build_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = python -c 'from ledger_viewer import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = "dist/DudLedger-$version-Windows-x64.zip"
          python scripts/check_windows.py $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA-256: $sha"
          "path=$zip" >> $env:GITHUB_OUTPUT
          "SHA-256: $sha" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload tested ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.portable.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
