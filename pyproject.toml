[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ledger-viewer"
version = "0.3.0"
description = "默认本地处理的法律尽调账簿浏览器，可选 Jev 云端筛查"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4", "xlrd>=2.0.2,<3", "typesafe-sdk>=0.7.1,<1", "keyring>=25.7,<27"]

[project.scripts]
legal-ledger-viewer = "ledger_viewer.ui:main"

[tool.setuptools.packages.find]
include = ["ledger_viewer*"]

[tool.setuptools.package-data]
ledger_viewer = ["skills/dudledger-import/*.md", "specialist_rules.json"]
