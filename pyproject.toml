[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-ledger-viewer"
version = "0.1.0"
description = "离线法律尽调账簿浏览器"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
legal-ledger-viewer = "ledger_viewer.ui:main"

[tool.setuptools.packages.find]
include = ["ledger_viewer*"]
